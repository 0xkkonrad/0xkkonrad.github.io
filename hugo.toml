baseURL = "https://kkonrad.com/"
languageCode = "en-us"
title = "Konrad Urban"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[pagination]
  pagerSize = 20

[minify]
  disableXML = true
  minifyOutput = true

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  env = "production"
  description = "Konrad Urban thinks too much about payments. Cofounder of Peanut; writing about payment technology, trade-offs, and occasional absurdities."
  author = "Konrad Urban"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  ShowToc = true
  TocOpen = false
  disableSpecial1stPost = true
  disableScrollToTop = false
  hideFooter = true
  hidemeta = false
  hideSummary = false
  comments = false
  mainSections = []

  profileImage = "pfp.jpg"

  # default social-share card (og:image / twitter:image) for every page
  images = ["og-card.png"]

  # analytics: create a (free) account at goatcounter.com, then uncomment —
  # the script tag in layouts/partials/extend_head.html renders only when set
  # goatcounter = "kkonrad"

  [params.homeInfoParams]
    Title = "I’m Konrad and I think too much about payments."
    Subtitle = "At [Peanut](https://peanut.me), we’re making global payments simpler. I write about the technology, trade-offs, and occasional absurdities behind them."
    Content = """
Find me on [LinkedIn](https://www.linkedin.com/in/konrad-urban/), [Twitter](https://twitter.com/0xkkonrad), or [Substack](https://kkonrad.substack.com/).
"""

  [params.assets]
    disableHLJS = false
    favicon = ""
    favicon16x16 = ""
    favicon32x32 = ""
    apple_touch_icon = ""
    safari_pinned_tab = ""

[[menu.main]]
  identifier = "writing"
  name = "writing"
  url = "/writing/"
  weight = 10

[[menu.main]]
  identifier = "talks"
  name = "talks"
  url = "/talks/"
  weight = 20

[[menu.main]]
  identifier = "beyond-payments"
  name = "beyond"
  url = "/beyond-payments/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "search"
  url = "/search/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
